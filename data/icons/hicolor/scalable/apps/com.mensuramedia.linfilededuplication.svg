<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon composed from local Phosphor glyphs (MIT): 'copy' + 'check-circle' badge,
     per docs/05-iconography.md 5.6. Accent tile in the app blue. -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9bf0"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- Phosphor 'copy' glyph, white, centred slightly up-left -->
  <g fill="#ffffff" transform="translate(30,24) scale(0.62)">
    <path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32Zm-8,128H176V88a8,8,0,0,0-8-8H96V48H208Z"/>
  </g>
  <!-- gap ring so the badge separates from the white glyph -->
  <circle cx="186" cy="186" r="58" fill="#2f74cc"/>
  <!-- Phosphor 'check-circle' badge, white (the check reads through as the tile colour) -->
  <g fill="#ffffff" transform="translate(135,135) scale(0.40)">
    <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/>
  </g>
</svg>
